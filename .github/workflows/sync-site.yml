name: sync-site (temporary)
on:
  workflow_dispatch:
    inputs:
      sha256:
        description: expected sha256 of assembled site.tar.xz
        required: true
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace site with archive contents
        env:
          SUM: ${{ inputs.sha256 }}
        run: |
          set -euo pipefail
          cat .sync/p*.b64 | tr -d '\n' | base64 -d > /tmp/site.tar.xz
          echo "$SUM  /tmp/site.tar.xz" | sha256sum -c -
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          tar xJf /tmp/site.tar.xz -C .
          git config user.name "sachin1024-92"
          git config user.email "sachin1024-92@users.noreply.github.com"
          git add -A -- . ':!.github'
          git status --short
          git commit -m "Sync site with current local source"
          git push origin HEAD:main
