name: sync-site (temporary)
on:
  workflow_dispatch:
    inputs:
      url:
        description: tarball URL
        required: true
      sha256:
        description: expected sha256 of tarball
        required: true
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace site with tarball contents
        env:
          URL: ${{ inputs.url }}
          SUM: ${{ inputs.sha256 }}
        run: |
          set -euo pipefail
          curl -fsSL "$URL" -o /tmp/site.tar.gz
          echo "$SUM  /tmp/site.tar.gz" | sha256sum -c -
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          tar xzf /tmp/site.tar.gz -C .
          git config user.name "sachin1024-92"
          git config user.email "sachin1024-92@users.noreply.github.com"
          git add -A -- . ':!.github'
          git status --short
          git commit -m "Sync site with current local source"
          git push origin HEAD:main
